<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Campus Connect</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a class="site-name" href="index.html">Campus Connect</a>
        <a href="index.html" data-page="index.html">Home</a>
        <a href="community.html" data-page="community.html">Community</a>
        <a href="profile.html" data-page="profile.html">Profile</a>
        <a href="login.html" data-page="login.html">Log in</a>
      </nav>

      <main>
        <h1>Log in</h1>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" required />
          </div>
          <p id="login-error" class="form-error" hidden></p>
          <button type="submit">Log in</button>
        </form>
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </main>
    </div>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
