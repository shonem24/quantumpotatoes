<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thread — Campus Connect</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a class="site-name" href="index.html">Campus Connect</a>
        <a href="index.html" data-page="index.html">Home</a>
        <a href="community.html" data-page="community.html">Community</a>
        <a href="profile.html" data-page="profile.html">Profile</a>
        <a href="login.html" data-page="login.html">Log in</a>
      </nav>

      <main>
        <a class="back-link" href="community.html">Back to Community</a>

        <p id="thread-category"></p>
        <h1 id="thread-title"></h1>
        <p id="thread-meta"></p>
        <p id="thread-body"></p>

        <h2>Comments</h2>
        <div id="comments"></div>

        <form id="comment-form" class="comment-form">
          <div class="form-group">
            <label for="comment-body">Write a comment</label>
            <textarea id="comment-body" name="body" required></textarea>
          </div>
          <p id="comment-error" class="form-error" hidden></p>
          <button type="submit">Post</button>
        </form>
      </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
