<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — Campus Connect</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a class="site-name" href="index.html">Campus Connect</a>
        <a href="index.html" data-page="index.html">Home</a>
        <a href="community.html" data-page="community.html">Community</a>
        <a href="profile.html" data-page="profile.html">Profile</a>
        <a href="login.html" data-page="login.html">Log in</a>
      </nav>

      <main>
        <h1>Sign up</h1>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input id="signup-username" name="Username" type="text" required />
          </div>
          <div class="form-group">
            <label for="signup-displayname">Display name</label>
            <input id="signup-displayname" name="Displayname" type="text" required />
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" required />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" required />
          </div>
          <div class="form-group">
            <label for="signup-major">Major</label>
            <input id="signup-major" name="major" type="text" />
          </div>
          <p id="signup-error" class="form-error" hidden></p>
          <button type="submit">Create account</button>
        </form>
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </main>
    </div>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
