<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drexel Community — Campus Connect</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <a class="site-name" href="index.html">Campus Connect</a>
        <a href="index.html" data-page="index.html">Home</a>
        <a href="community.html" data-page="community.html">Community</a>
        <a href="profile.html" data-page="profile.html">Profile</a>
        <a href="login.html" data-page="login.html">Log in</a>
      </nav>

      <main>
        <h1>Drexel University</h1>
        <p>Browse Campus, Housing, and Co-ops discussions.</p>

        <div class="categories">
          <label for="category-filter">Category</label>
          <select id="category-filter" name="category-filter">
            <option value="">All</option>
            <option value="Campus">Campus</option>
            <option value="Housing">Housing</option>
            <option value="Co-ops">Co-ops</option>
          </select>
        </div>

        <h2>New thread</h2>
        <p id="thread-login-prompt" class="login-prompt" hidden>
          <a href="login.html">Log in</a> to create a thread.
        </p>
        <form id="thread-form" class="thread-form">
          <div class="form-group">
            <label for="thread-title-input">Title</label>
            <input id="thread-title-input" name="title" type="text" required />
          </div>
          <div class="form-group">
            <label for="thread-category-input">Category</label>
            <select id="thread-category-input" name="category" required>
              <option value="">Select a category</option>
              <option value="Campus">Campus</option>
              <option value="Housing">Housing</option>
              <option value="Co-ops">Co-ops</option>
            </select>
          </div>
          <div class="form-group">
            <label for="thread-content-input">Content</label>
            <textarea id="thread-content-input" name="content" required></textarea>
          </div>
          <p id="thread-error" class="form-error" hidden></p>
          <button type="submit">Post thread</button>
        </form>

        <ul id="thread-list" class="thread-list"></ul>
      </main>
    </div>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
